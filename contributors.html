<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contributors - HSC Batch 2028</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --gold: #d97706;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            font-size: 26px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        /* Team Grid: Centered Layout */
        .team-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            margin-bottom: 40px;
        }

        /* Contributor Card (Golden Border Design like Section A) */
        .contributor-card {
            background: var(--card-bg);
            border: 2px solid transparent;
            border-image: linear-gradient(135deg, #f59e0b, #d97706, #b45309) 1;
            border-radius: 16px;
            padding: 24px 16px;
            box-shadow: 0 6px 15px rgba(217, 119, 6, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            
            /* Strict Fixed Size constraints (Chepta ba stretch hobe na) */
            flex: 0 0 220px;
            width: 220px;
            box-sizing: border-box;
        }

        .contributor-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 22px rgba(217, 119, 6, 0.2);
        }

        /* Avatar Styling */
        .avatar-container {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 14px;
            overflow: hidden;
            border: 2px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fef3c7;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Fallback Initial style */
        .avatar-initial {
            font-size: 32px;
            font-weight: 700;
            color: #b45309;
        }

        .member-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .member-role {
            font-size: 13px;
            font-weight: 600;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .member-bio {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 4px;
        }

        /* Portfolio Button Inside Card */
        .portfolio-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 14px;
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .portfolio-btn:hover {
            background: var(--primary);
            color: white;
            box-shadow: 0 3px 8px rgba(37, 99, 235, 0.2);
        }

        /* Back Button */
        .back-btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Project Contributors of <span style="color: #020101;">CpscsHsc-Tracker</span></h1>

        <!-- Contributors Grid Container -->
        <div class="team-grid" id="team-container">
            <!-- JavaScript will render cards dynamically here -->
        </div>

        <a href="index.html" class="back-btn">← হোম পেজে ফিরে যান</a>
    </div>

    <script>
        // Contributors Data
        const contributorsData = [
            {
                name: "Ahnaf Tahmid",
                role: "Creator & Lead Executive Developer",
                image: "ahnaf.png",
                bio: "System Architecture, UI/UX Design & Logic Implementation",
                portfolio: "ahnaftahmid.html" 
            },
            {
                name: "Sazim All Sifat",
                role: "Co-Initiator & Development Collaborator",
                image: "",
                bio: "Data Management & Institutional Support",
                portfolio: "https://sns121blueberry.netlify.app"
            }
        ];

        function renderContributors() {
            const container = document.getElementById('team-container');
            container.innerHTML = '';

            contributorsData.forEach(member => {
                const initial = member.name ? member.name.charAt(0).toUpperCase() : 'M';
                
                let avatarHTML = '';
                if (member.image && member.image.trim() !== "") {
                    avatarHTML = `<img src="${member.image}" alt="${member.name}" onerror="this.onerror=null; this.parentNode.innerHTML='<span class=\'avatar-initial\'>${initial}</span>';">`;
                } else {
                    avatarHTML = `<span class="avatar-initial">${initial}</span>`;
                }

                // Portfolio link thakle button toiri hobe
                let portfolioHTML = '';
                if (member.portfolio && member.portfolio.trim() !== "") {
                    portfolioHTML = `<a href="${member.portfolio}" target="_blank" class="portfolio-btn">See Portfolio</a>`;
                }

                const card = document.createElement('div');
                card.className = 'contributor-card';
                card.innerHTML = `
                    <div class="avatar-container">
                        ${avatarHTML}
                    </div>
                    <div class="member-name">${member.name}</div>
                    <div class="member-role">${member.role}</div>
                    <div class="member-bio">${member.bio}</div>
                    ${portfolioHTML}
                `;
                container.appendChild(card);
            });
        }

        window.onload = renderContributors;
    </script>
</body>
</html>
