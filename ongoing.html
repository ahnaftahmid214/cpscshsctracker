/* === ৫টি সেকশনের ৫ রকম কালার (Light Mode) === */
:root[data-theme="light"] {

    --card-bg: #ffffff;
    --card-border: #cbd5e1;
    --card-shadow: 0 10px 25px rgba(99, 102, 241, 0.08);
    --text-main: #0f172a;
    --text-muted: #475569;
    --primary-btn: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
    --primary-color: #4f46e5;
    --pill-bg: #e0e7ff;
    --pill-text: #3730a3;
    --sub-card-bg: #f8fafc;
    --sub-card-border: #cbd5e1;
}
:root[data-theme="dark"] {
    --bg-gradient: radial-gradient(circle at 50% 0%, #2c1052 0%, #16062f 45%, #080212 100%);
    --card-bg: rgba(45, 20, 75, 0.55);
    --card-border: rgba(255, 255, 255, 0.2);
    --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    --text-main: #f8fafc;
    --text-muted: #cbd5e1;
    --primary-btn: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    --primary-color: #a855f7;
    --pill-bg: rgba(124, 58, 237, 0.25);
    --pill-text: #e9d5ff;
    --sub-card-bg: rgba(20, 8, 35, 0.55);
    --sub-card-border: rgba(255, 255, 255, 0.12);
}


body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    margin: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    transition: background 0.3s ease, color 0.3s ease;
}

.container { width: 100%; max-width: 550px; padding-bottom: 40px; }

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
}

.nav-btn {
    background: var(--card-bg);
    border: 1px solid var(--sub-card-border);
    color: var(--text-main);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    box-shadow: var(--card-shadow);
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.hero-card {
    background: var(--card-bg);
    border: 1px solid var(--sub-card-border);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: var(--card-shadow);
    text-align: center;
}

.hero-card h2 {
    margin: 0 0 6px 0;
    font-size: 20px;
    font-weight: 800;
    color: var(--primary-color);
}

.hero-card p {
    margin: 0 0 14px 0;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
}

.action-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
}

.primary-pill-btn {
    background: var(--primary-btn);
    color: #fff;
    border: none;
    padding: 9px 15px;
    border-radius: 12px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
}

.secondary-pill-btn {
    background: var(--sub-card-bg);
    color: var(--text-main);
    border: 1px solid var(--sub-card-border);
    padding: 9px 14px;
    border-radius: 12px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
}

.filter-select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid var(--sub-card-border);
    background: var(--card-bg);
    color: var(--text-main);
    font-size: 13.5px;
    font-weight: 700;
    margin-bottom: 16px;
    outline: none;
    box-shadow: var(--card-shadow);

.notif-status-bar {

    font-weight: 700;
    margin-top: 10px;
    padding: 7px 12px;
    border-radius: 10px;
    background: var(--pill-bg);
    color: var(--pill-text);
    display: inline-block;

    padding: 16px;
    margin-bottom: 16px;

:root[data-theme="light"] .section-card-special {

    border: 2px solid #d97706;
}
:root[data-theme="dark"] .section-card-special {

    border: 2px solid #d97706;
}

.sec-top {

    justify-content: space-between;
    align-items: center;

.sec-left {

.sec-avatar {

.sec-title h3 { margin: 0; font-size: 16px; font-weight: 800; }

.sec-right {
    display: flex;

    gap: 8px;
}

.toggle-label-mini {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);

/* iOS Style Toggle Switch */
.switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
    flex-shrink: 0;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #94a3b8;
    transition: 0.3s;
    border-radius: 34px;
}
.slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: 0.3s;
    border-radius: 50%;
}
input:checked + .slider {
    background: linear-gradient(135deg, #10b981, #059669);
}
input:checked + .slider:before {
    transform: translateX(20px);
}

.topic-pill {

    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }

let liveSectionData = {};
let swRegistration = null;
const PREF_STORAGE_KEY = 'cpscs_teacher_notif_prefs';

function getSavedPrefs() {
    try {
        return JSON.parse(localStorage.getItem(PREF_STORAGE_KEY) || '{}');
    } catch { return {}; }
}

function savePrefs(prefs) {
    localStorage.setItem(PREF_STORAGE_KEY, JSON.stringify(prefs));
}

// Service Worker রেজিস্টার করা
async function initServiceWorker() {
    const statusEl = document.getElementById('notif-status-bar');
    if (!('serviceWorker' in navigator) || !('Notification' in window)) {
        statusEl.innerText = '⚠️ এই ব্রাউজারে নোটিফিকেশন সাপোর্ট করে না';
        return;
    }
    try {
        swRegistration = await navigator.serviceWorker.register('sw.js');
        updatePermissionStatusUI();
    } catch (err) {
        statusEl.innerText = '⚠️ Service Worker লোড হয়নি (HTTPS / Live Site প্রয়োজন)';
    }
}

function updatePermissionStatusUI() {
    const statusEl = document.getElementById('notif-status-bar');
    const prefs = getSavedPrefs();
    const activeCount = Object.values(prefs).filter(Boolean).length;

    if (Notification.permission === 'granted') {
        statusEl.innerText = `✅ নোটিফিকেশন চালু আছে (${activeCount}টি সাবজেক্ট টগল ON)`;
    } else if (Notification.permission === 'denied') {
        statusEl.innerText = '❌ নোটিফিকেশন ব্লক করা আছে — ব্রাউজার সেটিংস থেকে Allow করুন';
    } else {
        statusEl.innerText = '🔔 যেকোনো টগল ON করলে নোটিফিকেশন পারমিশন চাইবে';
    }
}


let isAskingPermission = false;

async function ensureNotificationPermission() {
    if (!('Notification' in window)) {
        alert('দুঃখিত, আপনার ব্রাউজার নোটিফিকেশন সাপোর্ট করে না।');
        return false;
    }
    if (Notification.permission === 'granted') return true;
    if (Notification.permission === 'denied') {
        alert('নোটিফিকেশন ব্লক করা আছে! অনুগ্রহ করে ব্রাউজারের Site Settings থেকে Notifications Allow করুন।');
        return false;
    }
    if (isAskingPermission) return false; // একবার পারমিশন চাইলে দ্বিতীয়বার আটকাবে

    isAskingPermission = true;
    try {
        const result = await Notification.requestPermission();
        updatePermissionStatusUI();
        return result === 'granted';
    } finally {
        isAskingPermission = false;
    }
}

// নির্দিষ্ট সেকশন ও সাবজেক্টের চলমান (In Progress) অধ্যায় ও টপিক বের করা
function getOngoingDetails(sIdx, subIdx) {
    const secId = `sec_${sIdx}`;
    const states = (liveSectionData[secId] && liveSectionData[secId].states) ? liveSectionData[secId].states : {};
    const sub = syllabusStructure[subIdx];
    const ongoingChapters = [];

    sub.chapters.forEach((chap, chapIdx) => {
        const chapKey = `${secId}_sub_${subIdx}_chap_${chapIdx}`;
        const chapStatus = states[chapKey] || 'pending';

        const ongoingTopics = [];
        chap.topics.forEach((tName, tIdx) => {
            const tKey = `${chapKey}_topic_${tIdx}`;
            if (states[tKey] === 'in-progress') {
                ongoingTopics.push(tName);
            }
        });

        if (chapStatus === 'in-progress' || ongoingTopics.length > 0) {
            ongoingChapters.push({
                chapterName: chap.name,
                topics: ongoingTopics
            });
        }
    });

    return ongoingChapters;
}

// ফোনের নোটিফিকেশন বারে মেসেজ পাঠানো বা আপডেট করা
async function pushSubjectNotification(sIdx, subIdx) {
    if (Notification.permission !== 'granted') return;
    if (!swRegistration) {
        swRegistration = await navigator.serviceWorker.ready;
    }

    const secName = sections[sIdx];
    const subName = syllabusStructure[subIdx].name;
    const ongoing = getOngoingDetails(sIdx, subIdx);
    const tag = `cpscs_ongoing_sec_${sIdx}_sub_${subIdx}`;

    let bodyText = '';
    if (ongoing.length === 0) {
        bodyText = 'বর্তমানে এই বিষয়ে কোনো অধ্যায় "In Progress" হিসেবে মার্ক করা নেই।';
    } else {
        bodyText = ongoing.map(item => {
            if (item.topics.length > 0) {
                return `${item.chapterName} ➝ ${item.topics.join(', ')}`;
            }
            return `${item.chapterName} (চলমান)`;
        }).join(' | ');
    }

        await swRegistration.showNotification(`${secName} • ${subName}`, {
                body: bodyText,
                icon: 'cpscslogo.png',
                tag: tag,
                renotify: true,
                requireInteraction: true,
                silent: false,
                data: { sticky: true }
            });
}

// নির্দিষ্ট নোটিফিকেশন বন্ধ করা
async function closeSubjectNotification(sIdx, subIdx) {
    if (!swRegistration) return;
    const tag = `cpscs_ongoing_sec_${sIdx}_sub_${subIdx}`;
    const notifications = await swRegistration.getNotifications({ tag });
    notifications.forEach(n => n.close());
}

// সাবজেক্ট টগল হ্যান্ডলার
async function toggleSubjectAlert(sIdx, subIdx, isChecked) {
    const key = `sec_${sIdx}_sub_${subIdx}`;
    const prefs = getSavedPrefs();

    if (isChecked) {
        const granted = await ensureNotificationPermission();
        if (!granted) {
            renderOngoingSections();
            return;
        }
        prefs[key] = true;
        savePrefs(prefs);
        await pushSubjectNotification(sIdx, subIdx);
    } else {
        delete prefs[key];
        savePrefs(prefs);
        await closeSubjectNotification(sIdx, subIdx);
    }
    updatePermissionStatusUI();
    renderOngoingSections();
}

// পুরো সেকশনের মাস্টার টগল হ্যান্ডলার
async function toggleSectionMasterAlert(e, sIdx, isChecked) {
    e.stopPropagation();
    const prefs = getSavedPrefs();
    const filterVal = document.getElementById('subject-filter').value;

    if (isChecked) {
        const granted = await ensureNotificationPermission();
        if (!granted) {
            renderOngoingSections();
            return;
        }
        syllabusStructure.forEach((_, subIdx) => {
            if (filterVal === 'all' || Number(filterVal) === subIdx) {
                prefs[`sec_${sIdx}_sub_${subIdx}`] = true;
            }
        });
        savePrefs(prefs);
        // পারমিশন আগেই নেওয়া হয়েছে, তাই skipPrompt = true
        await syncAllActiveNotifications(false, true);
    } else {
        for (let subIdx = 0; subIdx < syllabusStructure.length; subIdx++) {
            if (filterVal === 'all' || Number(filterVal) === subIdx) {
                delete prefs[`sec_${sIdx}_sub_${subIdx}`];
                await closeSubjectNotification(sIdx, subIdx);
            }
        }
        savePrefs(prefs);
    }
    updatePermissionStatusUI();
    renderOngoingSections();
}

async function syncAllActiveNotifications(showFeedback = false, skipPrompt = false) {
    const prefs = getSavedPrefs();
    const activeKeys = Object.keys(prefs).filter(k => prefs[k]);

    if (activeKeys.length === 0) {
        if (showFeedback) alert('আপনি এখনো কোনো সেকশন বা সাবজেক্টের টগল ON করেননি!');
        return;
    }

    if (skipPrompt) {
        if (Notification.permission !== 'granted') return;
    } else {
        const granted = await ensureNotificationPermission();
        if (!granted) return;
    }

    for (const key of activeKeys) {
        const match = key.match(/^sec_(\d+)_sub_(\d+)$/);
        if (match) {
            await pushSubjectNotification(Number(match[1]), Number(match[2]));
        }
    }
    updatePermissionStatusUI();
    if (showFeedback) {
        alert(`✅ ${activeKeys.length}টি নোটিফিকেশন আপনার নোটিফিকেশন বারে আপডেট করা হয়েছে!`);
    }
}


async function turnOffAllNotifications() {
    const prefs = getSavedPrefs();
    for (const key of Object.keys(prefs)) {
        const match = key.match(/^sec_(\d+)_sub_(\d+)$/);
        if (match) await closeSubjectNotification(Number(match[1]), Number(match[2]));
    }
    localStorage.removeItem(PREF_STORAGE_KEY);
    updatePermissionStatusUI();
    renderOngoingSections();
}

// ফিল্টার ড্রপডাউন পপুলেট করা
function initSubjectFilter() {
    const select = document.getElementById('subject-filter');
    syllabusStructure.forEach((sub, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = sub.name;
        select.appendChild(opt);
    });
}

// মেইন UI রেন্ডার করা
function renderOngoingSections() {
    const wrapper = document.getElementById('ongoing-wrapper');
    const filterVal = document.getElementById('subject-filter').value;
    const prefs = getSavedPrefs();
    let html = '';

    sections.forEach((secName, sIdx) => {
        const secId = `sec_${sIdx}`;
        const letter = secName.replace('Section ', '');
        const isSectionA = (secName === 'Section A');
const cardClass = isSectionA ? 'section-card section-card-special' : 'section-card';
        const lastUpdated = (liveSectionData[secId] && liveSectionData[secId].lastUpdated) ? liveSectionData[secId].lastUpdated : 'N/A';
        let ongoingSubCount = 0;
        let visibleSubCount = 0;
        let checkedSubCount = 0;
        let subjectsHtml = '';

        syllabusStructure.forEach((sub, subIdx) => {
            if (filterVal !== 'all' && Number(filterVal) !== subIdx) return;
            visibleSubCount++;

            const prefKey = `sec_${sIdx}_sub_${subIdx}`;
            const isChecked = !!prefs[prefKey];
            if (isChecked) checkedSubCount++;

            const ongoingList = getOngoingDetails(sIdx, subIdx);
            if (ongoingList.length > 0) ongoingSubCount++;

            let ongoingHtml = '';
            if (ongoingList.length > 0) {
                ongoingHtml = '<div class="ongoing-list">';
                ongoingList.forEach(item => {
                    let topicsHtml = '';
                    if (item.topics.length > 0) {
                        topicsHtml = '<div>' + item.topics.map(t => `<span class="topic-pill">🔹 ${t}</span>`).join('') + '</div>';
                    }
                    ongoingHtml += `<div class="ongoing-chip">
                        <span class="spinner-dot"></span><strong>${item.chapterName}</strong>
                        ${topicsHtml}
                    </div>`;
                });
                ongoingHtml += '</div>';
            } else {
                ongoingHtml = `<div class="no-ongoing-text">বর্তমানে কোনো অধ্যায় চলমান (In Progress) নেই</div>`;
            }

            subjectsHtml += `
                <div class="subject-item ${ongoingList.length > 0 ? 'has-ongoing' : ''}">
                    <div class="sub-header">
                        <div class="sub-name">${sub.name}</div>
                        <label class="switch" title="এই সাবজেক্টের নোটিফিকেশন চালু/বন্ধ করুন">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSubjectAlert(${sIdx}, ${subIdx}, this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                    ${ongoingHtml}
                </div>
            `;
        });

        const isMasterChecked = (visibleSubCount > 0 && checkedSubCount === visibleSubCount);

        html += `
            <div class="${cardClass}">
                <div class="sec-top">
                    <div class="sec-left">
                        <div class="sec-avatar">${letter}</div>
                        <div class="sec-title">
                            <h3>${secName} ${isSectionA ? '⭐' : ''}</h3>
                            <div class="sec-meta">চলমান বিষয়: ${ongoingSubCount}টি • Updated: ${lastUpdated}</div>
                        </div>
                    </div>
                    <div class="sec-right">
                        <span class="toggle-label-mini">সব Alert</span>
                        <label class="switch" title="${secName}-এর সব নোটিফিকেশন চালু/বন্ধ করুন">
                            <input type="checkbox" ${isMasterChecked ? 'checked' : ''} onchange="toggleSectionMasterAlert(event, ${sIdx}, this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div class="subjects-list">
                    ${subjectsHtml}
                </div>
            </div>
        `;
    });

    wrapper.innerHTML = html;
}

// Firebase লাইভ লিসেনার
function startLiveSync() {
    db.ref('section_progress').on('value', (snapshot) => {
        liveSectionData = snapshot.val() || {};
        renderOngoingSections();
        // ব্যাকগ্রাউন্ড সিঙ্কে কখনো নতুন করে পারমিশন চাইবে না
        syncAllActiveNotifications(false, true);
    });
}

window.addEventListener('load', async () => {
    initSubjectFilter();
    await initServiceWorker();
    startLiveSync();
});
</script>
</body>
</html>
